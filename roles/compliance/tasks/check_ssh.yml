---
- name: Check PermitRootLogin
  command: grep -i "PermitRootLogin" /etc/ssh/sshd_config
  register: root_login_check
  changed_when: false
  failed_when: false

- name: Set SSH root login compliance
  set_fact:
    ssh_root_compliant: "{{ 'no' in root_login_check.stdout | lower }}"

- name: Check SSH Protocol
  command: grep -i "Protocol" /etc/ssh/sshd_config
  register: protocol_check
  changed_when: false
  failed_when: false

- name: Set SSH protocol compliance
  set_fact:
    ssh_protocol_compliant: "{{ '2' in protocol_check.stdout }}"
