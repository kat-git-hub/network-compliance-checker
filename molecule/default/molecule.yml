---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: test-instance
    image: ubuntu:22.04
    pre_build_image: true
    command: >
      bash -c "
        apt-get update -qq &&
        apt-get install -y -qq openssh-server sudo python3 chrony &&
        mkdir -p /run/sshd &&
        /usr/sbin/sshd -D
      "
    privileged: true
provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
