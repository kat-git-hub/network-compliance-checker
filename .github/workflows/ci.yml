name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Run ansible-lint
        run: poetry run ansible-lint roles/

  test:
    name: Compliance Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Generate SSH key
        run: ssh-keygen -t rsa -b 4096 -f ~/.ssh/id_rsa -N ""

      - name: Start containers
        run: docker compose up -d

      - name: Wait for SSH
        run: |
          for port in 2221 2222 2223 2224 2225; do
            attempts=0
            until ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i ~/.ssh/id_rsa -p $port ubuntu@localhost true 2>/dev/null; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 24 ]; then
                echo "Timeout waiting for port $port"
                exit 1
              fi
              sleep 5
            done
            echo "Port $port ready"
          done

      - name: Run Ansible playbook
        run: poetry run ansible-playbook -i hosts.ini site.yml

      - name: Run compliance tests
        run: poetry run pytest tests/ -v

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-reports
          path: reports/
